<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запазете час — Denny Divine Aesthetic Center</title>
<meta name="description" content="Запазете безплатна консултация в Denny Divine Aesthetic Center, София. Обадете се или оставете телефон и зоната, която ви интересува.">
<link rel="icon" href="../../assets/img/brand/logo-zlato-znak.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 19px; scroll-behavior: smooth; }
  body {
    margin: 0; background: #F8F4ED; color: #262320;
    font-family: "Manrope", "Segoe UI", sans-serif; font-size: 1rem; line-height: 1.65;
  }
  img { display: block; }
  h1, h2 { margin: 0; line-height: 1.05; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  a { color: #8A6B3F; text-decoration: none; }
  a:hover { color: #B8934F; }
  @media (max-width: 900px) { html { font-size: 18px; } }

  /* Същата колона като на останалите страници. */
  .obvivka { max-width: 1200px; margin: 0 auto; padding: 0 clamp(1.4rem, 4vw, 3.6rem); }

  .shapka {
    display: flex; align-items: center; justify-content: space-between; gap: 1.2rem;
    padding: 1rem max(clamp(1.4rem, 4vw, 3.6rem), calc((100% - 1200px) / 2));
    border-bottom: 1px solid rgba(184,147,79,0.4);
  }
  .shapka img { height: 42px; width: auto; }
  .shapka .telefon {
    font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.35rem;
    color: #262320; white-space: nowrap;
  }

  .nadslov {
    display: flex; align-items: center; gap: 0.8rem;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.24em;
    text-transform: uppercase; color: #B8934F;
  }
  .nadslov::before {
    content: ""; display: block; width: 2.4rem; height: 1px; background: #B8934F;
  }

  h1 {
    margin-top: 1.4rem;
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400;
    font-size: clamp(2.6rem, 6vw, 4.2rem); letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: #8A6B3F; }

  .koloni { display: grid; gap: clamp(1.8rem, 4vw, 3rem); align-items: start; }
  @media (min-width: 60rem) { .koloni { grid-template-columns: 1fr 1fr; } }

  .karta {
    padding: clamp(1.6rem, 3vw, 2.4rem);
    background: #FFFFFF; border-top: 2px solid #B8934F; border-radius: 5px;
  }
  .karta h2 {
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400;
    font-size: clamp(1.8rem, 3vw, 2.4rem);
  }

  /* Телефонът се чете преди всичко останало в картата. */
  .nomer {
    display: block; margin-top: 1.2rem;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2rem, 4vw, 2.6rem); line-height: 1.1;
    color: #262320; white-space: nowrap;
  }
  .nomer:hover { color: #8A6B3F; }

  .redove { margin-top: 1.6rem; display: grid; gap: 1.1rem; }
  .red { display: grid; gap: 0.2rem; }
  .red .etiket {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: #B8934F;
  }
  .red .stojnost { font-size: 1.06rem; }
  .red .stojnost a { color: #262320; }
  .red .stojnost a:hover { color: #B8934F; }

  /* Двата бутона са еднакви и минават от край до край на картата. */
  .buton, button {
    display: flex; align-items: center; justify-content: center; text-align: center;
    width: 100%; margin-top: 1.4rem;
    padding: 1.05rem 1rem; border: 0; border-radius: 5px; cursor: pointer;
    background: linear-gradient(135deg, #E4C98F 0%, #B8934F 52%, #8A6B3F 100%);
    color: #241A12; font-family: inherit; font-size: 1rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    transition: filter 0.35s, transform 0.35s, box-shadow 0.35s;
  }
  .buton:hover, button:hover {
    filter: brightness(1.1); transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(138,107,63,0.4); color: #241A12;
  }

  label { display: grid; gap: 0.45rem; font-size: 0.95rem; color: rgba(38,35,32,0.72); }
  input, select, textarea {
    display: block; width: 100%; max-width: 100%; min-width: 0;
    padding: 0.85rem 1rem; min-height: 3.1rem;
    border: 1px solid rgba(184,147,79,0.4); border-radius: 5px;
    background: #FFFFFF; color: #262320;
    font-family: inherit; font-size: 1rem;
  }

  /* Падащият списък.

     Стрелката е тънка птичка, нарисувана веднъж като SVG. Преди беше два
     наклонени градиента, които на телефон изглеждаха като черно триъгълниче
     и се разминаваха с рамката.

     Дългите имена на апаратите не бива да разпъват полето: ellipsis реже
     текста вместо да избута страницата настрани. Списъкът, който се отваря
     при цъкане, е на операционната система и винаги се побира в екрана. */
  select {
    appearance: none;
    padding-right: 2.6rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%23B8934F' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 0.72rem auto;
    cursor: pointer;
  }
  select:invalid { color: rgba(38,35,32,0.72); }

  input:focus, select:focus, textarea:focus {
    outline: 2px solid #B8934F; outline-offset: 1px;
  }
  textarea { min-height: 6.5rem; resize: vertical; }
  form { margin-top: 1.4rem; display: grid; gap: 1.1rem; }

  .podval {
    margin-top: clamp(3rem, 8vw, 5rem);
    padding: 1.4rem max(clamp(1.4rem, 4vw, 3.6rem), calc((100% - 1200px) / 2));
    border-top: 1px solid rgba(184,147,79,0.4);
    display: flex; flex-wrap: wrap; gap: 0.8rem 1.4rem;
    font-size: 0.95rem; color: rgba(38,35,32,0.72);
  }
</style>
</head>
<body>

<header class="shapka">
  <a href="../"><img src="../../assets/img/logo.webp" alt="Denny Divine"></a>
  <a class="telefon" href="tel:+359888998556">+359 88 899 8556</a>
</header>

<main class="obvivka" style="padding-top: clamp(2.6rem, 7vw, 4.5rem);">

  <p class="nadslov">Безплатна консултация</p>
  <h1>Запазете <em>час</em></h1>

  <div class="koloni" style="margin-top: clamp(2.4rem, 6vw, 3.6rem);">

    <section class="karta">
      <h2>Обадете се</h2>
      <a class="nomer" href="tel:+359888998556">+359 88 899 8556</a>
      <a class="buton" href="tel:+359888998556">Обадете се</a>

      <div class="redove">
        <div class="red">
          <span class="etiket">Поща</span>
          <span class="stojnost"><a href="mailto:info@hifubg.com">info@hifubg.com</a></span>
        </div>
        <div class="red">
          <span class="etiket">Адрес</span>
          <span class="stojnost">бул. „Свети Наум“ 70А, 1421 София</span>
        </div>
        <div class="red">
          <span class="etiket">Работно време</span>
          <span class="stojnost">вторник до събота</span>
        </div>
      </div>
    </section>

    <section class="karta">
      <h2>Направете запитване</h2>

      <form id="forma">
        <label>Име
          <input type="text" name="ime" autocomplete="name" required>
        </label>
        <label>Телефон
          <input type="tel" name="telefon" autocomplete="tel" required>
        </label>
        <label>Зона, която ви интересува
          <select name="predmet" id="predmet">
        <option value="">Изберете зона</option>
        <option value="Лице и шия">Лице и шия</option>
        <option value="Тяло">Тяло</option>
        <option value="Лазерни процедури">Лазерни процедури</option>
        <option value="Интимно здраве">Интимно здраве</option>
        <option value="Процедури за мъже">Процедури за мъже</option>
        <option value="Още не знам">Още не знам</option>
          </select>
        </label>
        <label>Какво искате да ни кажете
          <textarea name="belezhka" id="belezhka"></textarea>
        </label>
        <button type="submit">Изпрати</button>
      </form>
    </section>

  </div>
</main>

<footer class="podval">
  <span>бул. „Свети Наум“ 70А, 1421 София</span>
  <span>·</span>
  <a href="tel:+359888998556">+359 88 899 8556</a>
  <span>·</span>
  <a href="mailto:info@hifubg.com">info@hifubg.com</a>
  
</footer>

<script>
var IMENA = {
  "aisia": "AISIA",
  "akne": "Акне по лицето",
  "akne-tqlo": "Акне по тялото",
  "bedra": "Бедра",
  "bedra-epilaciq": "Бедра",
  "bqst": "Стягане на бюст",
  "brahioplastika": "Ръце над лакътя",
  "celi-kraka": "Цели крака",
  "celi-race": "Цели ръце",
  "chelo": "Чело",
  "cqlo-lice": "Цяло лице с шията",
  "dekolte": "Деколте",
  "dolen-kontur": "Долен контур на лицето",
  "dvojna-bradichka": "Двойна брадичка",
  "emslim-cqlo-tqlo": "Цяло тяло",
  "emslim-korem": "Корем",
  "emslim-kraka": "Крака",
  "emslim-race": "Ръце",
  "emslim-sedalishte": "Седалище",
  "epilaciq-intim": "Трайна епилация на интимната зона",
  "epilaciya-kraka": "Крака",
  "estella": "Estella Laser",
  "fotopodmladqvane": "Фотоподмладяване",
  "fotopodmladqvane-lice": "Фотоподмладяване на цяло лице",
  "fotopodmladqvane-zona": "Фотоподмладяване на зона",
  "foxy-eyes": "Foxy eyes",
  "gardi-korem": "Гърди и корем",
  "gnevna-brachka": "Гневна бръчка",
  "gorna-ustna": "Горна устна",
  "grab": "Гръб",
  "grab-ramene": "Гръб и рамене",
  "grim-ustni": "Перманентен грим на устни",
  "hifu-13d": "HIFU 13D Ultraformer",
  "hifu-3d": "HIFU 3D",
  "hifu-5d": "HIFU 5D",
  "hifu-7d": "HIFU Ultraformer 7D",
  "hifu-cqlo-tqlo": "Цяло тяло",
  "hifu-korem": "Корем",
  "hifu-kraka": "Крака",
  "hifu-lice": "Лице и шия",
  "hifu-lice-shiya": "HIFU на лице и шия",
  "hifu-race": "Ръце",
  "hifu-sedalishte": "Седалище",
  "hifu-tqlo": "Тяло",
  "hiperhidroza": "Прекомерно изпотяване",
  "inkontinenciq": "Инконтиненция",
  "intim": "Интимна зона",
  "intim-podmishnici": "Интимна зона и подмишници",
  "intimno-podmladqvane": "Интимно подмладяване",
  "intimno-zdrave": "Интимно здраве",
  "kapilqri": "Разширени капилярчета",
  "karbonov-piling": "Холивудски карбонов пилинг",
  "klepach": "Повдигане на клепача",
  "kolene": "Колене",
  "korem": "Корем",
  "lazer": "Лазерни процедури",
  "marionetni": "Марионетни линии",
  "maxlipo-13d": "13D MaxLipo Laser",
  "nazolabialni": "Назолабиални линии",
  "ochna-liniq": "Перманентна очна линия",
  "okoloochen-kontur": "Околоочен контур",
  "permanenten-grim": "Перманентен грим и микроблейдинг",
  "petna-lice": "Пигментни петна по лицето",
  "pigmentaciq": "Пигментация по подмишниците и интимните зони",
  "pigmentaciq-intimni-zoni": "Пигментация по интимните зони",
  "pigmentaciq-mishnici": "Пигментация по мишниците",
  "podbedrici": "Подбедрици",
  "podmishnici": "Подмишници",
  "prasci": "Прасци",
  "race": "Ръце",
  "raztvarqne-filar": "Разтваряне на филър",
  "rf-lice": "Стягане на лицето с радиофреквенция",
  "santimetri": "Сантиметри в талията и бедрата",
  "sedalishte": "Седалище",
  "shiq": "Шия",
  "skuli": "Скули",
  "soprano": "Soprano Diode Laser",
  "strii": "Стрии",
  "tatuirovki": "Татуировки",
  "tazovo-dano": "Тазово дъно",
  "tesla-15": "Tesla 15 EMSLIM RF",
  "tesla-21": "Tesla 21 EMSLIM Chair",
  "tonus": "Стягане на корема и седалището",
  "ustna-brada": "Горна устна и брада",
  "vrat": "Врат",
  "za-maje": "Процедури за мъже",
  "zona-pubis": "Зона пубис"
};

(function () {
  var params = new URLSearchParams(window.location.search);
  var kljuch = params.get('usluga');
  var ime = kljuch && IMENA[kljuch] ? IMENA[kljuch] : null;
  var spisak = document.getElementById('predmet');

  if (ime) {
    var ima = Array.prototype.some.call(spisak.options, function (o) {
      return o.value === ime;
    });
    if (!ima) {
      // Страницата, от която идва човекът, може да е за по-тясна зона,
      // отколкото стои в списъка. Тогава тя влиза като своя стойност.
      var nova = document.createElement('option');
      nova.value = ime;
      nova.textContent = ime;
      spisak.insertBefore(nova, spisak.options[1] || null);
    }
    spisak.value = ime;
  }

  document.getElementById('forma').addEventListener('submit', function (e) {
    e.preventDefault();
    var d = new FormData(e.target);
    var tqlo = [
      'Име: ' + (d.get('ime') || ''),
      'Телефон: ' + (d.get('telefon') || ''),
      'Зона, която ви интересува: ' + (d.get('predmet') || 'не е посочено'),
      '',
      d.get('belezhka') || ''
    ].join('\n');
    var predmet = 'Запазване на час' + (d.get('predmet') ? ', ' + d.get('predmet') : '');
    window.location.href = 'mailto:info@hifubg.com'
      + '?subject=' + encodeURIComponent(predmet)
      + '&body=' + encodeURIComponent(tqlo);
  });
})();
</script>

</body>
</html>
